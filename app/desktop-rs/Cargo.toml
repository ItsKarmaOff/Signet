[workspace]
resolver = "3"
members = [
  "crates/signet-core",
  "crates/signet-features",
  "crates/signet-link",
  "crates/signet-extensions",
  "crates/signet-scripts",
  "crates/signet-pages",
  "crates/signet-web",
  "crates/signet-ui",
  "crates/signet-app",
  "crates/signet-helper",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates
signet-core = { path = "crates/signet-core" }
signet-features = { path = "crates/signet-features" }
signet-link = { path = "crates/signet-link" }
signet-web = { path = "crates/signet-web" }
signet-ui = { path = "crates/signet-ui" }
signet-extensions = { path = "crates/signet-extensions" }
signet-scripts = { path = "crates/signet-scripts" }
signet-pages = { path = "crates/signet-pages" }

# UI: gpui-component 0.9 pins the published gpui prerelease, so we use the same one.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-component = "0.9"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }

# Web engine
cef = "156.3"

# Common
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
tempfile = "3"

[profile.dev]
# Keep debug builds usable: GPUI and CEF glue are slow without some optimization.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4

# gpui-component 0.9.0 with the font probes skipped on macOS (see vendor/gpui-component/SIGNET-PATCH.md).
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
