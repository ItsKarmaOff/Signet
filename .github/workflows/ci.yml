# Checks on every push and pull request on main and dev: types, lint, format, i18n, unit tests (3 systems)
# and Playwright end-to-end tests (Linux under Xvfb, macOS), plus the Android app build (test APK as an artifact)
# when the mobile app is touched.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @signet/mobile
      # Proves that Metro resolves @signet/shared and that the app compiles for Hermes.
      - run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/export-ios"
        working-directory: app/mobile
      - run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export-android"
        working-directory: app/mobile

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Linux: no display, so we provide a virtual one.
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
      - if: runner.os != 'Linux'
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ runner.os }}
          path: |
            app/desktop/test-results/
            app/desktop/playwright-report/
          if-no-files-found: ignore

  # Whether the mobile app is touched: its code, the shared package, the dependencies or this file. Compared with the
  # pull request's base, or for a push with the branch's last commit whose CI passed (so the commits of a cancelled or
  # failed run count too). Without a reference commit, the mobile app counts as touched.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ $EVENT == pull_request ]]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          else
            base=$(gh run list --workflow ci.yml --branch "$BRANCH" --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          fi
          if [[ -z $base ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No reference commit: the Android app is built."
            echo "mobile=true" >>"$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -qE '^(app/mobile/|packages/shared/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'; then
            echo "Mobile app touched since ${base:0:7}: the Android app is built."
            echo "mobile=true" >>"$GITHUB_OUTPUT"
          else
            echo "Mobile app not touched since ${base:0:7}: the Android build is skipped."
            echo "mobile=false" >>"$GITHUB_OUTPUT"
          fi

  # Builds the Android app (native project generated by Expo, native modules included). The test APK is kept for 14 days.
  # Skipped when the mobile app is not touched (a skipped job counts as passed for the required checks).
  android:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        working-directory: app/mobile
        env:
          CI: 1
      - run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
        working-directory: app/mobile/android
      - uses: actions/upload-artifact@v7
        with:
          name: Signet-Android-ci
          path: app/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error
