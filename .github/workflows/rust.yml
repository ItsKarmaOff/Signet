# Desktop (Rust): builds the GPUI + CEF app (app/desktop-rs) on Linux, macOS and Windows, runs the unit tests,
# bundles it with the same scripts as a release, then launches the bundle and runs its self-test
# (scripts/selftest.sh: SIGNET_SELFTEST=1 prints one PASS or FAIL line per check, any FAIL fails the job).
# Runs on pushes to main, dev and feat/gpui-desktop and on pull requests, only when app/desktop-rs or this file changes.
# Artifacts (14 days): the bundle, the self-test log and a screenshot of the running app, one set per system.
# The first build is long (CEF is about 500 MB, GPUI and Chromium glue are big); the caches make the next ones short.
# cargo fmt is not checked: the tree is not rustfmt-clean yet.
name: Desktop (Rust)

on:
  push:
    branches: [main, dev, feat/gpui-desktop]
    paths: ['app/desktop-rs/**', '.github/workflows/rust.yml']
  pull_request:
    branches: [main, dev]
    paths: ['app/desktop-rs/**', '.github/workflows/rust.yml']
  workflow_dispatch:

# Pushes of a branch each get their own run (the first builds are long, a cancelled one reports nothing);
# only a new push to a pull request cancels the older run of that pull request.
concurrency:
  group: rust-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: 1.99.1
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 4
  # cef-dll-sys downloads and extracts CEF here (reused through the cache).
  CEF_PATH: ${{ github.workspace }}/.cef

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: app/desktop-rs
    steps:
      - uses: actions/checkout@v7

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config patchelf \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-dev libwayland-dev libvulkan-dev \
            libdbus-1-dev libgtk-3-dev libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 \
            libasound2t64 libfontconfig1-dev libfreetype-dev libssl-dev \
            xvfb openbox x11-utils imagemagick mesa-vulkan-drivers libgl1-mesa-dri

      - name: Build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja coreutils
          # GPUI compiles its Metal shaders with this component; it is missing on some runner images.
          xcrun -find metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Build tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y --no-progress
          cmake --version

      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      # Restore, then save at the very end even when a step failed: a first build that stops at a failing test or
      # self-test would otherwise throw its 40 minutes of compilation away. A run saves under its own id (caches are
      # immutable), later runs restore the newest one through the prefix.
      - name: Restore the cargo and CEF cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/desktop-rs/target
            ${{ env.CEF_PATH }}
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/desktop-rs/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/desktop-rs/Cargo.lock') }}-
            rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Tests
        run: cargo test --workspace

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: scripts/bundle-macos.sh --release

      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        run: scripts/bundle-linux.sh --release

      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/bundle-windows.ps1 -Release

      - name: Self-test (Linux, virtual display)
        if: runner.os == 'Linux'
        env:
          WORK: ${{ runner.temp }}/selftest
        run: |
          mkdir -p "$WORK"
          cat > "$RUNNER_TEMP/session.sh" <<'SESSION'
          #!/usr/bin/env bash
          openbox >"$WORK/openbox.log" 2>&1 &
          sleep 2
          # Screenshot of the running app, taken in the background while the self-test runs.
          ( for i in 1 2 3 4; do sleep 25; import -window root "$WORK/screenshot-$i.png"; xwininfo -root -tree > "$WORK/xwininfo-$i.txt"; done ) >/dev/null 2>&1 &
          scripts/selftest.sh --release
          code=$?
          import -window root "$WORK/screenshot-end.png" >/dev/null 2>&1
          exit $code
          SESSION
          chmod +x "$RUNNER_TEMP/session.sh"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" "$RUNNER_TEMP/session.sh"

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        env:
          WORK: ${{ runner.temp }}/selftest
          TIMEOUT: gtimeout
          # The runner session never gives the app a key window: these checks need one.
          ALLOW_FAIL: spaceform\.key_window|spaceform\.typing|sidebar\.toggle|sidebar\.restore|win\.welcome
        run: |
          mkdir -p "$WORK"
          ( for i in 1 2 3 4; do sleep 25; screencapture -x "$WORK/screenshot-$i.png"; done ) >/dev/null 2>&1 &
          scripts/selftest.sh --release

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        env:
          WORK: ${{ runner.temp }}/selftest
          # Needs a focused window, which the runner session gives only sometimes.
          ALLOW_FAIL: win\.welcome
        run: |
          mkdir -p "$WORK"
          cat > "$RUNNER_TEMP/shot.ps1" <<'PS'
          param([string]$Out)
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save($Out, [System.Drawing.Imaging.ImageFormat]::Png)
          PS
          ( for i in 1 2 3 4; do sleep 25; powershell -NoProfile -File "$(cygpath -w "$RUNNER_TEMP/shot.ps1")" -Out "$(cygpath -w "$WORK/screenshot-$i.png")"; done ) >/dev/null 2>&1 &
          scripts/selftest.sh --release

      - name: Upload the self-test log and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-${{ runner.os }}
          path: ${{ runner.temp }}/selftest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: signet-${{ runner.os }}
          path: |
            app/desktop-rs/dist/Signet.app
            app/desktop-rs/dist/signet-linux
            app/desktop-rs/dist/signet-windows
          if-no-files-found: ignore
          retention-days: 14

      - name: Save the cargo and CEF cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/desktop-rs/target
            ${{ env.CEF_PATH }}
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/desktop-rs/Cargo.lock') }}-${{ github.run_id }}
